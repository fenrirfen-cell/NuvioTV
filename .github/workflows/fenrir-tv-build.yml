name: Fenrir TV build

# Builds Fenrir TV (this fork of NuvioTV) and publishes it as a GitHub release.
# Once a day it checks for a new official NuvioTV *release* (not daily commits);
# only when there is one (or when you press "Run workflow") does it build.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  # Build whenever Fenrir TV changes are pushed (the schedule only runs from the default branch).
  push:
    branches: [fenrir-tv]
    paths-ignore:
      - "**.md"

permissions:
  contents: write
  issues: write

concurrency:
  group: fenrir-tv-build
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/NuvioMedia/NuvioTV.git
  BRANCH: fenrir-tv

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Merge official NuvioTV release
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "fenrir-bot"
          git config user.email "fenrir-bot@users.noreply.github.com"
          TAG=$(git ls-remote --tags "$UPSTREAM" | awk '{print $2}' | grep -v '\^{}' | sed 's#refs/tags/##' \
                | awk '{k=$0; sub(/^v/,"",k); sub(/-/,"~",k); print k" "$0}' | sort -V -k1,1 | tail -1 | awk '{print $2}')
          echo "Latest official NuvioTV release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git fetch -q "$UPSTREAM" "refs/tags/$TAG:refs/tags/upstream-$TAG"
          if git merge-base --is-ancestor "upstream-$TAG" HEAD; then
            echo "Already has $TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit -m "Merge official NuvioTV $TAG" "upstream-$TAG"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "::warning::NuvioTV $TAG clashes with Fenrir TV changes; building without it."
            gh issue create --title "NuvioTV $TAG needs a manual merge" \
              --body "The automatic merge of official NuvioTV $TAG into $BRANCH hit a conflict. Fenrir TV keeps building from the last good version." || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.merge.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new official release; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save merged code
        if: steps.decide.outputs.build == 'true' && steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:$BRANCH"

      - name: Set up Java
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Keys and signing key
        id: keys
        if: steps.decide.outputs.build == 'true'
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$LOCAL_PROPERTIES" ] || [ -z "$DEBUG_KEYSTORE_B64" ]; then
            # Without the keys the code is still compiled (to catch mistakes), but no app is published.
            echo "::warning::Secrets LOCAL_PROPERTIES and DEBUG_KEYSTORE_B64 are not set in this repo (Settings > Secrets and variables > Actions). Use the same values as the phone app's repo. Only checking that the code compiles."
            touch local.properties local.dev.properties
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$LOCAL_PROPERTIES" > local.properties
          touch local.dev.properties
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n\t \"' | base64 -d > "$RUNNER_TEMP/fenrir.jks"
          # Same key as the phone app (the standard debug key format).
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/fenrir.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build
        if: steps.decide.outputs.build == 'true' && steps.keys.outputs.ready == 'true'
        run: ./gradlew :app:assembleFullDebug -Pdebuggable=false --stacktrace

      - name: Compile only (no signing keys)
        if: steps.decide.outputs.build == 'true' && steps.keys.outputs.ready != 'true'
        run: ./gradlew :app:compileFullDebugKotlin --stacktrace

      - name: Check app
        if: steps.decide.outputs.build == 'true' && steps.keys.outputs.ready == 'true'
        run: |
          APK=app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E "^package:|application-label:|leanback-launchable|banner" | head

      - name: Publish release
        if: steps.decide.outputs.build == 'true' && steps.keys.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=app/build/outputs/apk/full/debug
          VER=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="fenrirtv-${VER}-r${GITHUB_RUN_NUMBER}"
          NAME="FenrirTV-${VER}-r${GITHUB_RUN_NUMBER}"
          cp "$OUT/app-full-universal-debug.apk"   "${NAME}-universal.apk"
          cp "$OUT/app-full-arm64-v8a-debug.apk"   "${NAME}-arm64-v8a.apk"
          cp "$OUT/app-full-armeabi-v7a-debug.apk" "${NAME}-armeabi-v7a.apk"
          NOTES="Fenrir TV build ${GITHUB_RUN_NUMBER}, based on official NuvioTV ${{ steps.merge.outputs.tag }}.

          Most TVs and sticks: download the **armeabi-v7a** or **universal** APK."
          gh release create "$TAG" "${NAME}-universal.apk" "${NAME}-arm64-v8a.apk" "${NAME}-armeabi-v7a.apk" \
            --title "Fenrir TV ${VER} (build ${GITHUB_RUN_NUMBER})" --notes "$NOTES" --target "$(git rev-parse HEAD)"
          # Keep only the 5 newest Fenrir TV releases.
          gh release list --limit 100 --json tagName,createdAt --jq '.[] | select(.tagName|startswith("fenrirtv-")) | .tagName' \
            | tail -n +6 | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done
